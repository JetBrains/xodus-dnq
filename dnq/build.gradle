configurations { tests }

dependencies {
    implementation project(':dnq-open-api')
    implementation project(':dnq-transient-store')

    api "joda-time:joda-time:2.1"

    implementation "org.jetbrains:annotations:15.0"
    implementation project(':dnq-xodus-open-api')
    implementation project(':dnq-entity-store')
    implementation project(':dnq-query')
    implementation project(':dnq-utils')
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    implementation "org.reflections:reflections:0.10.2"
    implementation "javax.servlet:javax.servlet-api:3.0.1"

    testImplementation project(':dnq')
    testImplementation "com.google.truth:truth:$google_truth_version"
    testImplementation 'org.hamcrest:java-hamcrest:2.0.0.0'
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
}

test {
    if (project.hasProperty('collectQueryShapes')) {
        jvmArgs "-Ddnq.query.collector.enabled=true",
                "-Ddnq.query.collector.output=/tmp/dnq-query-shapes.txt"
    }
}

tasks.register('testJar', Jar) {
    dependsOn testClasses
    archiveBaseName = "${project.archivesBaseName}-tests"
    from sourceSets.test.output
}

artifacts { tests testJar }
